name: Haya Planner APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Haya_Planner_GitHub_Android_Source.zip'
      - '.github/workflows/Haya_Planner_APK_Workflow_NEW.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get files
        uses: actions/checkout@v7

      - name: Unzip Haya Planner source
        run: |
          test -f Haya_Planner_GitHub_Android_Source.zip
          mkdir -p source
          unzip -oq Haya_Planner_GitHub_Android_Source.zip -d source
          test -s source/app/src/main/assets/index.html
          test -s source/app/src/main/java/com/hayaplanner/app/MainActivity.java

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        run: gradle --no-daemon -p source :app:assembleDebug

      - name: Verify APK exists
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          unzip -t source/app/build/outputs/apk/debug/app-debug.apk | tail -1

      - name: Downloadable APK
        uses: actions/upload-artifact@v6
        with:
          name: Haya-Planner-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
