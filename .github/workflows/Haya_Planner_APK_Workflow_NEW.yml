name: Haya Planner APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'Haya_Planner_GitHub_Android_Source.zip'
      - '.github/workflows/Haya_Planner_APK_Workflow_NEW.yml'
      - 'Haya_Planner_Settings_Override.html'
      - 'Haya_Planner_ReminderScheduler_Override.java'
      - 'Haya_Planner_PrayerCalendarFetcher_Override.java'
      - 'Haya_Planner_ReminderReceiver_Override.java'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Get files
        uses: actions/checkout@v7

      - name: Unzip Haya Planner source
        run: |
          test -f Haya_Planner_GitHub_Android_Source.zip
          mkdir -p source
          unzip -oq Haya_Planner_GitHub_Android_Source.zip -d source
          test -s source/app/src/main/assets/index.html
          test -s source/app/src/main/java/com/hayaplanner/app/MainActivity.java

      - name: Apply latest app interface and version
        run: |
          cp Haya_Planner_Settings_Override.html source/app/src/main/assets/index.html
          cp Haya_Planner_MainActivity_Override.java source/app/src/main/java/com/hayaplanner/app/MainActivity.java
          cp Haya_Planner_ReminderScheduler_Override.java source/app/src/main/java/com/hayaplanner/app/PlannerReminderScheduler.java
          cp Haya_Planner_PrayerCalendarFetcher_Override.java source/app/src/main/java/com/hayaplanner/app/PrayerCalendarFetcher.java
          cp Haya_Planner_ReminderReceiver_Override.java source/app/src/main/java/com/hayaplanner/app/PlannerReminderReceiver.java
          sed -i "s/versionCode 14/versionCode 19/; s/versionName '1.7.2'/versionName '1.7.7'/" source/app/build.gradle
          grep -q "versionName '1.7.7'" source/app/build.gradle
          grep -q 'scheduleTaskReminder' source/app/src/main/java/com/hayaplanner/app/MainActivity.java
          grep -q 'scheduleTaskReminder' source/app/src/main/java/com/hayaplanner/app/PlannerReminderScheduler.java
          grep -q 'nextPrayerTrigger' source/app/src/main/java/com/hayaplanner/app/PlannerReminderScheduler.java
          grep -q 'PrayerCalendarFetcher.refreshAsync(context)' source/app/src/main/java/com/hayaplanner/app/PlannerReminderScheduler.java
          grep -q 'PlannerReminderScheduler.reschedule(app)' source/app/src/main/java/com/hayaplanner/app/PrayerCalendarFetcher.java

      - name: Download offline Quran pages
        run: python3 source/scripts/download_mushaf_pages.py

      - name: Install Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'
          cache-provider: basic

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Prepare Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Build Android APK
        run: gradle --no-daemon -p source :app:assembleDebug

      - name: Verify APK and full Mushaf pages
        run: |
          test -s source/app/build/outputs/apk/debug/app-debug.apk
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'source/app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(apk) as z:
              names = set(z.namelist())
              pages = [n for n in names if n.startswith('assets/mushaf/pages/') and n.endswith('.png')]
              assert len(pages) == 604, f'expected 604 bundled Quran pages; got {len(pages)}'
              for page in (1, 2, 49, 293, 304, 604):
                  name = f'assets/mushaf/pages/{page}.png'
                  assert name in names and z.getinfo(name).file_size > 3000, f'missing Mushaf page {page}'
              for name in ('assets/index.html', 'assets/adhkar-data.js', 'classes.dex'):
                  assert name in names, f'missing app resource: {name}'
              html = z.read('assets/index.html').decode('utf-8')
              receiver = z.read('classes.dex')
              assert b'PlannerReminderReceiver' in receiver, 'missing reminder receiver in dex'
              assert 'السبحة والعداد' in html, 'missing Tasbeeh counter'
              assert 'قارئ داخلي' in html, 'missing in-app Kahf reader'
              assert 'التنبيهات داخل التطبيق' in html, 'missing in-app reminders settings'
              assert 'function renderExportNote()' in html, 'missing settings export panel'
              assert 'إضافة تسبيحة خاصة' in html, 'missing custom Tasbeeh controls'
              assert 'data-setting-number="pomodoroFocus"' in html, 'missing focus duration selector'
              assert 'data-setting-number="pomodoroBreak"' in html, 'missing break duration selector'
              assert ':breakMinutes' in html, 'missing per-task break duration selector'
              assert "afterPrayer:'prayer_fajr'" in html, 'missing Fajr-relative morning adhkar default'
              assert "afterPrayer:'prayer_asr'" in html, 'missing Asr-relative evening adhkar default'
              assert 'offsetMinutes:15' in html, 'missing 15-minute adhkar reminder offset'
              assert "if(type==='water')" in html and 'target.scrollIntoView' in html, 'water reminder must focus water card'
              assert "if(type==='adhkarMorning'||type==='adhkarEvening'||type==='adhkarSleep')" in html and 'target.scrollIntoView' in html, 'adhkar reminders must focus adhkar reader'
              assert 'afterPrayer' in html, 'missing prayer-relative reminder mode'
              print(f'APK verified: {len(pages)} offline Mushaf pages plus Tasbeeh, Kahf reader, reminders, app and adhkar assets')
          PY
          unzip -t source/app/build/outputs/apk/debug/app-debug.apk | tail -1

      - name: Downloadable APK
        uses: actions/upload-artifact@v6
        with:
          name: Haya-Planner-APK
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
